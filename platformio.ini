; PlatformIO Project Configuration File

[platformio]
; 現在接続しているボードに合わせて切り替えてください
default_envs = uno_r4_wifi
; default_envs = uno

[env]
monitor_speed = 9600
monitor_port = /dev/ttyACM0

[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino